<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ragdoll Buddy</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #08060e; overflow: hidden;
    font-family: ui-monospace, "Courier New", monospace;
    -webkit-user-select: none; user-select: none;
    touch-action: none;
  }
  #stage {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
  }
  canvas {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    display: block;
    cursor: grab;
  }
  canvas.grabbing { cursor: grabbing; }
  #title {
    position: fixed; top: 12px; left: 0; right: 0; text-align: center;
    color: #5b4d8a; font-size: 11px; letter-spacing: 3px;
    text-transform: uppercase; pointer-events: none;
  }
  #title b { color: #b9a3ff; }
  #hud {
    position: fixed; left: 0; right: 0; bottom: 14px;
    display: flex; justify-content: center; gap: 8px;
    pointer-events: none;
  }
  button {
    pointer-events: auto;
    font-family: inherit; font-size: 11px; letter-spacing: 2px;
    text-transform: uppercase; color: #c8ffe6;
    background: #1d1733; border: 2px solid #4d3f7a;
    padding: 8px 16px; cursor: pointer;
    box-shadow: 3px 3px 0 #0d0a17;
    transition: background .08s;
  }
  button:hover { background: #2a2148; color: #fff; }
  button:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 #0d0a17; }
</style>
</head>
<body>
<div id="stage"><canvas id="c"></canvas></div>
<div id="title">RAGDOLL BUDDY <b>v1.0</b> &nbsp;·&nbsp; drag him &nbsp;·&nbsp; drag the void to orbit</div>
<div id="hud">
  <button id="btnReset">Reset</button>
  <button id="btnDrop">Drop</button>
  <button id="btnSpin">Spin</button>
</div>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>

<script type="module">
import * as THREE from 'three';

THREE.ColorManagement.enabled = false;

/* =========================================================
   RENDERER / SCENE / CAMERA
   ========================================================= */
const RES_W = 320, RES_H = 240;

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, alpha: false });
renderer.setPixelRatio(1);
renderer.setSize(RES_W, RES_H, false);
renderer.outputColorSpace = THREE.LinearSRGBColorSpace;
renderer.setClearColor(0x1b1430, 1);

const scene = new THREE.Scene();

const FOG_COLOR = new THREE.Color(0x1b1430);

const camera = new THREE.PerspectiveCamera(55, RES_W / RES_H, 0.3, 220);

const camState = { theta: 0.38, phi: 1.18, radius: 10.5, target: new THREE.Vector3(0, 1.9, 0) };

function updateCamera() {
  const sp = Math.sin(camState.phi), cp = Math.cos(camState.phi);
  camera.position.set(
    camState.target.x + camState.radius * sp * Math.sin(camState.theta),
    camState.target.y + camState.radius * cp,
    camState.target.z + camState.radius * sp * Math.cos(camState.theta)
  );
  camera.lookAt(camState.target);
  camera.updateMatrixWorld();
}
updateCamera();

/* =========================================================
   RETRO SHADER  (PS1 vertex snapping + banded shading + fog)
   ========================================================= */
const VERT = `
uniform vec2 uSnap;
varying vec3 vNormal;
varying vec3 vViewPos;
varying vec2 vUv;

void main() {
  vUv = uv;
  vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
  vViewPos = mvPosition.xyz;
  vNormal = normalize(mat3(modelMatrix) * normal);

  vec4 clip = projectionMatrix * mvPosition;
  // --- PS1 style vertex snapping ---
  vec2 g = uSnap;
  vec2 ndc = clip.xy / clip.w;
  ndc = floor(ndc * g + 0.5) / g;
  clip.xy = ndc * clip.w;
  gl_Position = clip;
}
`;

const FRAG = `
uniform vec3  uColor;
uniform sampler2D uMap;
uniform float uUseMap;
uniform vec3  uFogColor;
uniform float uFogNear;
uniform float uFogFar;
uniform vec3  uLightDir;
uniform float uAlpha;

varying vec3 vNormal;
varying vec3 vViewPos;
varying vec2 vUv;

void main() {
  vec3 n = normalize(vNormal);
  float lambert = max(dot(n, normalize(uLightDir)), 0.0);

  vec3 base = uColor;
  if (uUseMap > 0.5) base *= texture2D(uMap, vUv).rgb;

  vec3 col = base * (0.60 + 0.65 * lambert);

  // colour banding -> limited palette look
  col = floor(col * 24.0 + 0.5) / 24.0;

  // distance fog
  float d = length(vViewPos);
  float f = clamp((d - uFogNear) / (uFogFar - uFogNear), 0.0, 1.0);
  col = mix(col, uFogColor, f);

  gl_FragColor = vec4(col, uAlpha);
}
`;

const WHITE_TEX = new THREE.DataTexture(new Uint8Array([255, 255, 255, 255]), 1, 1);
WHITE_TEX.needsUpdate = true;

const shared = {
  uFogColor: { value: FOG_COLOR },
  uFogNear:  { value: 11.0 },
  uFogFar:   { value: 38.0 },
  uLightDir: { value: new THREE.Vector3(0.45, 0.92, 0.55).normalize() },
  uSnap:     { value: new THREE.Vector2(RES_W * 0.5, RES_H * 0.5) },
};

function makeMaterial(color, opts = {}) {
  return new THREE.ShaderMaterial({
    uniforms: {
      uColor:    { value: new THREE.Color(color) },
      uMap:      { value: opts.map || WHITE_TEX },
      uUseMap:   { value: opts.map ? 1 : 0 },
      uAlpha:    { value: opts.alpha !== undefined ? opts.alpha : 1 },
      uFogColor: shared.uFogColor,
      uFogNear:  shared.uFogNear,
      uFogFar:   shared.uFogFar,
      uLightDir: shared.uLightDir,
      uSnap:     shared.uSnap,
    },
    vertexShader: VERT,
    fragmentShader: FRAG,
    transparent: !!opts.alpha && opts.alpha < 1,
    depthWrite: opts.alpha === undefined || opts.alpha >= 1,
  });
}

/* flat-shade helper: non-indexed + per-face normals */
function flat(geo) {
  const g = geo.index ? geo.toNonIndexed() : geo;
  g.computeVertexNormals();
  return g;
}

/* =========================================================
   ENVIRONMENT
   ========================================================= */
function makeCheckerTexture(c1, c2) {
  const cv = document.createElement('canvas');
  cv.width = cv.height = 2;
  const ctx = cv.getContext('2d');
  ctx.fillStyle = c1; ctx.fillRect(0, 0, 1, 1); ctx.fillRect(1, 1, 1, 1);
  ctx.fillStyle = c2; ctx.fillRect(1, 0, 1, 1); ctx.fillRect(0, 1, 1, 1);
  const tex = new THREE.CanvasTexture(cv);
  tex.magFilter = THREE.NearestFilter;
  tex.minFilter = THREE.NearestFilter;
  tex.generateMipmaps = false;
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(60, 60);
  return tex;
}

const groundTex = makeCheckerTexture('#2c2447', '#241d3a');
const groundGeo = flat(new THREE.PlaneGeometry(120, 120, 60, 60));
const groundMat = makeMaterial(0xffffff, { map: groundTex });
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
scene.add(ground);

/* --- obstacle boxes --- */
const boxDefs = [
  { p: [ 4.4, 0.45, -2.6], s: [2.2, 0.9, 2.2], c: 0x4a3d72 },
  { p: [-4.8, 0.35,  1.9], s: [1.8, 0.7, 1.8], c: 0x453a6b },
  { p: [ 1.7, 1.15,  4.4], s: [2.6, 2.3, 2.6], c: 0x554480 },
];

const colliders = [];
for (const b of boxDefs) {
  const g = flat(new THREE.BoxGeometry(b.s[0], b.s[1], b.s[2]));
  const m = new THREE.Mesh(g, makeMaterial(b.c));
  m.position.set(b.p[0], b.p[1], b.p[2]);
  scene.add(m);
  colliders.push({
    min: new THREE.Vector3(b.p[0] - b.s[0] / 2, b.p[1] - b.s[1] / 2, b.p[2] - b.s[2] / 2),
    max: new THREE.Vector3(b.p[0] + b.s[0] / 2, b.p[1] + b.s[1] / 2, b.p[2] + b.s[2] / 2),
  });
}

/* =========================================================
   CREATURE  —  PARTICLES & CONSTRAINTS
   ========================================================= */
class Particle {
  constructor(x, y, z, mass, radius) {
    this.pos = new THREE.Vector3(x, y, z);
    this.prev = new THREE.Vector3(x, y, z);
    this.invMass = mass > 0 ? 1 / mass : 0;
    this.radius = radius;
    this.grabbed = false;
  }
}

const P = {};
const particles = [];

const defs = {
  head:      [ 0.00, 3.30,  0.00, 1.0, 0.30],
  chest:     [ 0.00, 2.62,  0.00, 1.6, 0.34],
  hip:       [ 0.00, 1.80,  0.00, 1.6, 0.32],
  shoulderL: [-0.44, 2.80,  0.00, 0.7, 0.15],
  shoulderR: [ 0.44, 2.80,  0.00, 0.7, 0.15],
  elbowL:    [-0.72, 2.12,  0.00, 0.5, 0.13],
  elbowR:    [ 0.72, 2.12,  0.00, 0.5, 0.13],
  handL:     [-0.84, 1.46,  0.00, 0.5, 0.17],
  handR:     [ 0.84, 1.46,  0.00, 0.5, 0.17],
  kneeL:     [-0.28, 1.02,  0.00, 0.8, 0.14],
  kneeR:     [ 0.28, 1.02,  0.00, 0.8, 0.14],
  footL:     [-0.30, 0.24,  0.06, 0.6, 0.18],
  footR:     [ 0.30, 0.24,  0.06, 0.6, 0.18],
};

for (const name in defs) {
  const d = defs[name];
  const p = new Particle(d[0], d[1], d[2], d[3], d[4]);
  P[name] = p;
  particles.push(p);
}

const constraints = [];
const constraintDefs = [
  ['head', 'chest',       1.00, 'eq'],
  ['chest', 'hip',        1.00, 'eq'],
  ['head', 'hip',         0.55, 'min'],
  ['chest', 'shoulderL',  1.00, 'eq'],
  ['chest', 'shoulderR',  1.00, 'eq'],
  ['shoulderL', 'shoulderR', 1.00, 'eq'],
  ['shoulderL', 'hip',    0.80, 'eq'],
  ['shoulderR', 'hip',    0.80, 'eq'],
  ['shoulderL', 'elbowL', 1.00, 'eq'],
  ['elbowL', 'handL',     1.00, 'eq'],
  ['shoulderR', 'elbowR', 1.00, 'eq'],
  ['elbowR', 'handR',     1.00, 'eq'],
  ['shoulderL', 'handL',  0.45, 'min'],
  ['shoulderR', 'handR',  0.45, 'min'],
  ['hip', 'kneeL',        1.00, 'eq'],
  ['kneeL', 'footL',      1.00, 'eq'],
  ['hip', 'kneeR',        1.00, 'eq'],
  ['kneeR', 'footR',      1.00, 'eq'],
  ['hip', 'footL',        0.45, 'min'],
  ['hip', 'footR',        0.45, 'min'],
  ['kneeL', 'kneeR',      0.35, 'min'],
  ['handL', 'handR',      0.20, 'min'],
];

const MODE = { eq: 0, min: 1, max: 2 };

for (const [a, b, s, mode] of constraintDefs) {
  const pa = P[a], pb = P[b];
  const rest = pa.pos.distanceTo(pb.pos) * s;
  constraints.push({ a: pa, b: pb, rest, stiffness: 1.0, mode: MODE[mode] });
}

/* =========================================================
   CREATURE  —  MESHES
   ========================================================= */
const matHead    = makeMaterial(0x9ff2cd);
const matBody    = makeMaterial(0x7de3b8);
const matLimb    = makeMaterial(0x6fd3ab);
const matBelly   = makeMaterial(0xffe9a8);
const matEyeW    = makeMaterial(0xf6fcff);
const matEyeD    = makeMaterial(0x1a1226);
const matCheek   = makeMaterial(0xff9ec2);
const matEar     = makeMaterial(0x8ae8c0);
const matEarIn   = makeMaterial(0xff9ec2);

function sphereMesh(r, mat, detail = 1) {
  return new THREE.Mesh(flat(new THREE.IcosahedronGeometry(r, detail)), mat);
}
function boneMesh(r, mat, seg = 7) {
  return new THREE.Mesh(flat(new THREE.CylinderGeometry(r, r, 1, seg, 1, false)), mat);
}

/* --- head group --- */
const headGroup = new THREE.Group();
scene.add(headGroup);

const headBall = sphereMesh(0.56, matHead, 1);
headGroup.add(headBall);

// ears
for (const s of [-1, 1]) {
  const ear = new THREE.Mesh(flat(new THREE.ConeGeometry(0.17, 0.34, 4)), matEar);
  ear.position.set(s * 0.27, 0.45, -0.02);
  ear.rotation.z = -s * 0.34;
  ear.rotation.y = Math.PI / 4;
  headGroup.add(ear);

  const inner = new THREE.Mesh(flat(new THREE.ConeGeometry(0.09, 0.20, 4)), matEarIn);
  inner.position.set(s * 0.28, 0.48, 0.03);
  inner.rotation.z = -s * 0.34;
  inner.rotation.y = Math.PI / 4;
  headGroup.add(inner);
}

// googly eyes (slightly mismatched for maximum silliness)
const eyeData = [
  { x: -0.21, y:  0.10, z: 0.435, pr: 0.078, px: -0.155, py: 0.10 },
  { x:  0.21, y:  0.07, z: 0.435, pr: 0.066, px:  0.245, py: 0.09 },
];
for (const e of eyeData) {
  const white = sphereMesh(0.135, matEyeW, 1);
  white.position.set(e.x, e.y, e.z);
  headGroup.add(white);

  const pupil = sphereMesh(e.pr, matEyeD, 1);
  pupil.position.set(e.px, e.py, 0.53);
  headGroup.add(pupil);
}

// cheeks
for (const s of [-1, 1]) {
  const cheek = sphereMesh(0.10, matCheek, 0);
  cheek.position.set(s * 0.36, -0.13, 0.37);
  headGroup.add(cheek);
}

// little mouth
const mouth = sphereMesh(0.09, matEyeD, 0);
mouth.position.set(0, -0.18, 0.47);
mouth.scale.set(1.6, 0.65, 0.6);
headGroup.add(mouth);

/* --- joint spheres --- */
const jointData = [
  ['chest',     0.36, matBelly, 1],
  ['hip',       0.33, matBody,  1],
  ['shoulderL', 0.155, matLimb, 1],
  ['shoulderR', 0.155, matLimb, 1],
  ['elbowL',    0.135, matLimb, 0],
  ['elbowR',    0.135, matLimb, 0],
  ['handL',     0.175, matLimb, 1],
  ['handR',     0.175, matLimb, 1],
  ['kneeL',     0.145, matLimb, 0],
  ['kneeR',     0.145, matLimb, 0],
  ['footL',     0.19,  matLimb, 1],
  ['footR',     0.19,  matLimb, 1],
];
const jointMeshes = [];
for (const [name, r, mat, det] of jointData) {
  const m = sphereMesh(r, mat, det);
  if (name === 'footL' || name === 'footR') m.scale.set(1.15, 0.85, 1.35);
  scene.add(m);
  jointMeshes.push({ mesh: m, p: P[name] });
}

/* --- bones --- */
const boneData = [
  ['chest', 'hip',      0.30, matBelly, 8],
  ['shoulderL', 'elbowL', 0.105, matLimb, 6],
  ['elbowL', 'handL',   0.095, matLimb, 6],
  ['shoulderR', 'elbowR', 0.105, matLimb, 6],
  ['elbowR', 'handR',   0.095, matLimb, 6],
  ['hip', 'kneeL',      0.125, matLimb, 6],
  ['kneeL', 'footL',    0.115, matLimb, 6],
  ['hip', 'kneeR',      0.125, matLimb, 6],
  ['kneeR', 'footR',    0.115, matLimb, 6],
  ['chest', 'shoulderL', 0.13, matLimb, 6],
  ['chest', 'shoulderR', 0.13, matLimb, 6],
];
const boneMeshes = [];
for (const [a, b, r, mat, seg] of boneData) {
  const m = boneMesh(r, mat, seg);
  scene.add(m);
  boneMeshes.push({ mesh: m, a: P[a], b: P[b] });
}

/* =========================================================
   PHYSICS
   ========================================================= */
const GRAVITY = -26;
const DAMPING = 0.992;
const ITERATIONS = 10;
const RESTITUTION = 0.28;
const GROUND_FRICTION = 0.72;

function solveConstraint(c) {
  const a = c.a, b = c.b;
  const dx = b.pos.x - a.pos.x;
  const dy = b.pos.y - a.pos.y;
  const dz = b.pos.z - a.pos.z;
  const d2 = dx * dx + dy * dy + dz * dz;
  if (d2 < 1e-10) return;

  const dist = Math.sqrt(d2);
  if (c.mode === 1 && dist >= c.rest) return;
  if (c.mode === 2 && dist <= c.rest) return;

  const w = a.invMass + b.invMass;
  if (w < 1e-9) return;

  const diff = ((dist - c.rest) / dist) * c.stiffness;
  const kx = dx * diff, ky = dy * diff, kz = dz * diff;
  const ka = a.invMass / w, kb = b.invMass / w;

  a.pos.x += kx * ka; a.pos.y += ky * ka; a.pos.z += kz * ka;
  b.pos.x -= kx * kb; b.pos.y -= ky * kb; b.pos.z -= kz * kb;
}

function collideSphere(p) {
  // ground
  if (p.pos.y < p.radius) p.pos.y = p.radius;

  // boxes
  for (const c of colliders) {
    const cx = Math.max(c.min.x, Math.min(p.pos.x, c.max.x));
    const cy = Math.max(c.min.y, Math.min(p.pos.y, c.max.y));
    const cz = Math.max(c.min.z, Math.min(p.pos.z, c.max.z));
    const dx = p.pos.x - cx, dy = p.pos.y - cy, dz = p.pos.z - cz;
    const d2 = dx * dx + dy * dy + dz * dz;
    if (d2 > p.radius * p.radius) continue;

    const d = Math.sqrt(d2);
    if (d > 1e-5) {
      const s = (p.radius - d) / d;
      p.pos.x += dx * s; p.pos.y += dy * s; p.pos.z += dz * s;
    } else {
      // centre inside box — push out along the smallest axis
      const px1 = p.pos.x - c.min.x, px2 = c.max.x - p.pos.x;
      const py1 = p.pos.y - c.min.y, py2 = c.max.y - p.pos.y;
      const pz1 = p.pos.z - c.min.z, pz2 = c.max.z - p.pos.z;
      const m = Math.min(px1, px2, py1, py2, pz1, pz2);
      if (m === px1) p.pos.x = c.min.x - p.radius;
      else if (m === px2) p.pos.x = c.max.x + p.radius;
      else if (m === py1) p.pos.y = c.min.y - p.radius;
      else if (m === py2) p.pos.y = c.max.y + p.radius;
      else if (m === pz1) p.pos.z = c.min.z - p.radius;
      else p.pos.z = c.max.z + p.radius;
    }
  }

  // soft world bounds
  const B = 30;
  p.pos.x = Math.max(-B, Math.min(B, p.pos.x));
  p.pos.z = Math.max(-B, Math.min(B, p.pos.z));
}

function physicsStep(dt) {
  const dt2 = dt * dt;

  // --- integrate (verlet) ---
  for (const p of particles) {
    if (p.invMass === 0 || p.grabbed) continue;
    const vx = (p.pos.x - p.prev.x) * DAMPING;
    const vy = (p.pos.y - p.prev.y) * DAMPING;
    const vz = (p.pos.z - p.prev.z) * DAMPING;
    p.prev.set(p.pos.x, p.pos.y, p.pos.z);
    p.pos.x += vx;
    p.pos.y += vy + GRAVITY * dt2;
    p.pos.z += vz;
  }

  // --- solve ---
  for (let i = 0; i < ITERATIONS; i++) {
    for (const c of constraints) solveConstraint(c);
    for (const p of particles) if (!p.grabbed) collideSphere(p);
  }

  // --- ground response (friction + bounce), once per step ---
  for (const p of particles) {
    if (p.grabbed) continue;
    if (p.pos.y <= p.radius + 1e-4) {
      const vyBefore = p.pos.y - p.prev.y;
      p.pos.y = p.radius;

      const vx = p.pos.x - p.prev.x;
      const vz = p.pos.z - p.prev.z;
      p.prev.x = p.pos.x - vx * GROUND_FRICTION;
      p.prev.z = p.pos.z - vz * GROUND_FRICTION;

      if (vyBefore < -0.004) p.prev.y = p.pos.y + vyBefore * RESTITUTION;
      else p.prev.y = p.pos.y;
    }
  }
}

/* =========================================================
   VISUAL SYNC
   ========================================================= */
const _up = new THREE.Vector3();
const _right = new THREE.Vector3();
const _fwd = new THREE.Vector3();
const _m4 = new THREE.Matrix4();
const _dir = new THREE.Vector3();
const _mid = new THREE.Vector3();
const UP_VEC = new THREE.Vector3(0, 1, 0);

function syncHead() {
  _up.copy(P.head.pos).sub(P.chest.pos);
  if (_up.lengthSq() < 1e-8) _up.set(0, 1, 0); else _up.normalize();

  _right.copy(P.shoulderR.pos).sub(P.shoulderL.pos);
  if (_right.lengthSq() < 1e-8) _right.set(1, 0, 0); else _right.normalize();

  _fwd.crossVectors(_right, _up);
  if (_fwd.lengthSq() < 1e-6) _fwd.set(0, 0, 1); else _fwd.normalize();
  _right.crossVectors(_up, _fwd).normalize();

  _m4.makeBasis(_right, _up, _fwd);
  headGroup.quaternion.setFromRotationMatrix(_m4);
  headGroup.position.copy(P.head.pos);
}

function syncJoints() {
  for (const j of jointMeshes) j.mesh.position.copy(j.p.pos);
}

function syncBones() {
  for (const b of boneMeshes) {
    _mid.copy(b.a.pos).add(b.b.pos).multiplyScalar(0.5);
    b.mesh.position.copy(_mid);

    _dir.copy(b.b.pos).sub(b.a.pos);
    const len = _dir.length();
    if (len < 1e-5) continue;
    _dir.divideScalar(len);
    b.mesh.quaternion.setFromUnitVectors(UP_VEC, _dir);
    b.mesh.scale.set(1, len, 1);
  }
}

function syncAll() {
  syncHead();
  syncJoints();
  syncBones();
}

/* =========================================================
   INPUT
   ========================================================= */
const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();
const grabPlane = new THREE.Plane();
const hitPoint = new THREE.Vector3();
const camDir = new THREE.Vector3();

let dragging = null;
let orbiting = false;
let lastX = 0, lastY = 0;

function toBuffer(clientX, clientY) {
  const r = canvas.getBoundingClientRect();
  return {
    x: ((clientX - r.left) / r.width) * RES_W,
    y: ((clientY - r.top) / r.height) * RES_H,
  };
}

function findParticleNear(bx, by, maxDist) {
  let best = null;
  let bestD = maxDist;
  const v = new THREE.Vector3();
  for (const p of particles) {
    v.copy(p.pos).project(camera);
    const sx = (v.x * 0.5 + 0.5) * RES_W;
    const sy = (-v.y * 0.5 + 0.5) * RES_H;
    const d = Math.hypot(sx - bx, sy - by);
    if (d < bestD) { bestD = d; best = p; }
  }
  return best;
}

canvas.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  canvas.setPointerCapture(e.pointerId);

  const { x, y } = toBuffer(e.clientX, e.clientY);
  const p = findParticleNear(x, y, 24);

  if (p) {
    dragging = p;
    p.grabbed = true;
    p._invMass = p.invMass;
    p.invMass = 0;
    canvas.classList.add('grabbing');

    camera.getWorldDirection(camDir);
    grabPlane.setFromNormalAndCoplanarPoint(camDir, p.pos);
  } else {
    orbiting = true;
    canvas.classList.add('grabbing');
  }

  lastX = e.clientX;
  lastY = e.clientY;
});

window.addEventListener('pointermove', (e) => {
  if (!dragging && !orbiting) return;

  if (dragging) {
    const { x, y } = toBuffer(e.clientX, e.clientY);
    ndc.x = (x / RES_W) * 2 - 1;
    ndc.y = -(y / RES_H) * 2 + 1;
    raycaster.setFromCamera(ndc, camera);
    if (raycaster.ray.intersectPlane(grabPlane, hitPoint)) {
      dragging.pos.copy(hitPoint);
      // keep velocity coherent for the throw
      dragging.prev.lerp(dragging.pos, 0.85);
    }
  } else if (orbiting) {
    camState.theta -= (e.clientX - lastX) * 0.007;
    camState.phi -= (e.clientY - lastY) * 0.006;
    camState.phi = Math.max(0.35, Math.min(1.62, camState.phi));
    updateCamera();
  }

  lastX = e.clientX;
  lastY = e.clientY;
});

function endPointer() {
  if (dragging) {
    dragging.invMass = dragging._invMass;
    dragging.grabbed = false;
    dragging = null;
  }
  orbiting = false;
  canvas.classList.remove('grabbing');
}
window.addEventListener('pointerup', endPointer);
window.addEventListener('pointercancel', endPointer);

/* =========================================================
   UI ACTIONS
   ========================================================= */
function resetCreature(heightOffset = 0.35) {
  for (const name in defs) {
    const d = defs[name];
    const p = P[name];
    p.pos.set(d[0], d[1] + heightOffset, d[2]);
    p.prev.copy(p.pos);
  }
}
resetCreature();

function applyImpulse(vx, vy, vz) {
  for (const p of particles) {
    p.prev.x -= vx;
    p.prev.y -= vy;
    p.prev.z -= vz;
  }
}

document.getElementById('btnReset').addEventListener('click', () => {
  resetCreature(0.35);
});

document.getElementById('btnDrop').addEventListener('click', () => {
  resetCreature(6.5);
});

document.getElementById('btnSpin').addEventListener('click', () => {
  const ax = (Math.random() - 0.5) * 2;
  const az = (Math.random() - 0.5) * 2;
  applyImpulse(ax * 0.35, 0.55 + Math.random() * 0.3, az * 0.35);
  // a little twist
  for (const p of particles) {
    const rx = p.pos.x, rz = p.pos.z;
    p.prev.x += rz * 0.012;
    p.prev.z -= rx * 0.012;
  }
});

/* =========================================================
   RESIZE (pixel-perfect upscale of the 320x240 buffer)
   ========================================================= */
function resize() {
  const aspect = RES_W / RES_H;
  const w = window.innerWidth;
  const h = window.innerHeight;
  let cw, ch;
  if (w / h > aspect) { ch = h; cw = h * aspect; }
  else { cw = w; ch = w / aspect; }
  canvas.style.width = Math.round(cw) + 'px';
  canvas.style.height = Math.round(ch) + 'px';
}
window.addEventListener('resize', resize);
resize();

/* =========================================================
   MAIN LOOP
   ========================================================= */
const FIXED_DT = 1 / 60;
let accumulator = 0;
let lastTime = performance.now();

function loop(now) {
  requestAnimationFrame(loop);

  let dt = (now - lastTime) / 1000;
  lastTime = now;
  if (dt > 0.25) dt = 0.25;

  accumulator += dt;
  let steps = 0;
  while (accumulator >= FIXED_DT && steps < 5) {
    physicsStep(FIXED_DT);
    accumulator -= FIXED_DT;
    steps++;
  }
  if (steps === 5) accumulator = 0;

  syncAll();
  renderer.render(scene, camera);
}

syncAll();
requestAnimationFrame(loop);
</script>
