<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ragdoll Buddy — Cinematic Reel</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #08060e; overflow: hidden;
    font-family: ui-monospace, "Courier New", monospace;
    -webkit-user-select: none; user-select: none;
    touch-action: none;
  }
  #stage {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
  }
  canvas {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    display: block;
    cursor: grab;
  }
  canvas.grabbing { cursor: grabbing; }

  #title {
    position: fixed; top: 10px; left: 0; right: 0; text-align: center;
    color: #5b4d8a; font-size: 10px; letter-spacing: 3px;
    text-transform: uppercase; pointer-events: none; line-height: 1.6;
    transition: opacity .4s;
  }
  #title b { color: #b9a3ff; }
  #title span { color: #3d3460; }
  #title.hidden { opacity: 0; }

  #ui {
    position: fixed; left: 0; right: 0; bottom: 10px;
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    pointer-events: none;
    transition: opacity .4s, transform .4s;
  }
  #ui.hidden { opacity: 0; transform: translateY(20px); pointer-events: none; }
  .row { display: flex; gap: 5px; flex-wrap: wrap; justify-content: center; max-width: 96vw; }

  button {
    pointer-events: auto;
    font-family: inherit; font-size: 10px; letter-spacing: 1.5px;
    text-transform: uppercase; color: #c8ffe6;
    background: #1d1733; border: 2px solid #4d3f7a;
    padding: 6px 10px; cursor: pointer;
    box-shadow: 2px 2px 0 #0d0a17;
    transition: background .08s, color .08s;
    white-space: nowrap;
  }
  button:hover { background: #2a2148; color: #fff; }
  button:active { transform: translate(2px, 2px); box-shadow: 0 0 0 #0d0a17; }
  button.on {
    background: #4d3f7a; color: #fff; border-color: #b9a3ff;
    box-shadow: 0 0 0 #0d0a17, 0 0 10px rgba(185,163,255,.45);
  }
  button i {
    display: inline-block; width: 7px; height: 7px;
    margin-right: 5px; vertical-align: middle;
    border: 1px solid rgba(0,0,0,.5);
  }

  #cine {
    position: fixed; inset: 0; pointer-events: none;
    opacity: 0; transition: opacity .45s ease;
    z-index: 20;
  }
  #cine.on { opacity: 1; }
  #cine .bar {
    position: absolute; left: 0; right: 0; height: 11%;
    background: #05030a;
    transition: transform .65s cubic-bezier(.2,.85,.2,1);
  }
  #cine .bar.top { top: 0; transform: translateY(-101%); }
  #cine .bar.bot { bottom: 0; transform: translateY(101%); }
  #cine.on .bar.top { transform: translateY(0); }
  #cine.on .bar.bot { transform: translateY(0); }

  #cineTitle {
    position: absolute; left: 0; right: 0; bottom: 13.5%;
    text-align: center; pointer-events: none;
    text-shadow: 0 2px 0 #000;
  }
  #cineTitle .n {
    font-size: 13px; letter-spacing: 6px; color: #efe6ff;
    text-transform: uppercase;
  }
  #cineTitle .s {
    font-size: 9px; letter-spacing: 3px; color: #8a7fbe;
    margin-top: 5px; text-transform: uppercase;
  }

  #cineSkip {
    position: absolute; top: 2.2%; right: 2.2%;
    pointer-events: auto; z-index: 22;
    font-size: 9px; padding: 5px 10px;
    background: #14102a; border-color: #6b58a8; color: #d9cfff;
    box-shadow: 2px 2px 0 #000;
  }
  #cineSkip:hover { background: #2a2148; }

  #cineBar {
    position: absolute; left: 0; right: 0; bottom: 0;
    height: 3px; background: rgba(255,255,255,.08);
  }
  #cineBarFill {
    height: 100%; width: 0%;
    background: #b9a3ff;
    box-shadow: 0 0 8px rgba(185,163,255,.8);
  }

  /* ---------- SCREEN SAVER ---------- */
  body.saver, body.saver canvas { cursor: none; }

  #saverFade {
    position: fixed; inset: 0; z-index: 30;
    background: #05030a; opacity: 0;
    pointer-events: none;
  }

  #saverTag {
    position: fixed; left: 0; top: 0; z-index: 31;
    pointer-events: none; opacity: 0;
    transition: opacity .55s ease;
    text-shadow: 0 2px 0 #000;
    will-change: transform;
  }
  #saverTag.on { opacity: 1; }
  #saverTag .n { font-size: 11px; letter-spacing: 5px; color: #e7dcff; text-transform: uppercase; }
  #saverTag .s { font-size: 8px;  letter-spacing: 3px; color: #7a6dae; text-transform: uppercase; margin-top: 5px; }
  #saverTag .w { font-size: 8px;  letter-spacing: 3px; color: #463d6d; text-transform: uppercase; margin-top: 12px; }

  /* ---------- PS1 TACTICAL RETICLE ---------- */
  #crosshair {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 28px; height: 28px;
    pointer-events: none;
    z-index: 25;
    display: none;
  }
  #crosshair.visible { display: block; }

  .reticle-bracket {
    position: absolute;
    width: 6px; height: 6px;
    border-color: rgba(185, 163, 255, 0.7);
    border-style: solid;
    box-shadow: 1px 1px 0 #000;
    transition: transform 0.08s ease, border-color 0.08s ease;
  }
  .reticle-tl { top: 0; left: 0; border-width: 2px 0 0 2px; }
  .reticle-tr { top: 0; right: 0; border-width: 2px 2px 0 0; }
  .reticle-bl { bottom: 0; left: 0; border-width: 0 0 2px 2px; }
  .reticle-br { bottom: 0; right: 0; border-width: 0 2px 2px 0; }

  .reticle-pip {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 2px; height: 2px;
    background: #b9a3ff;
    box-shadow: 1px 1px 0 #000;
  }

  #crosshair.target .reticle-bracket {
    border-color: #ffd13b;
    transform: scale(0.85);
  }
  #crosshair.frozen .reticle-bracket {
    border-color: #5ce6e6;
  }
  #crosshair.carrying .reticle-pip {
    width: 4px; height: 4px;
    background: #ff5a8a;
  }

  /* ---------- PS1 WEAPON OSD ---------- */
  #hud {
    position: fixed;
    left: 18px; bottom: 18px;
    z-index: 22;
    display: flex; flex-direction: column; gap: 4px;
    align-items: flex-start;
    width: fit-content;
    max-width: calc(100vw - 36px);
    font-family: ui-monospace, "Courier New", monospace;
    pointer-events: auto;
    transition: opacity 0.25s ease, transform 0.25s ease;
  }
  #hud.hidden { opacity: 0; transform: translateY(12px); pointer-events: none; }

  .hud-panel {
    background: rgba(18, 14, 36, 0.92);
    border: 1px solid #4d3f7a;
    box-shadow: 2px 2px 0 #000;
    padding: 3px 4px;
    color: #e7dcff;
    letter-spacing: 1.5px;
    font-size: 10px;
    text-transform: uppercase;
    width: fit-content;
    box-sizing: border-box;
    transition: border-color 0.2s ease, background 0.2s ease;
  }

  .hud-slots {
    display: flex; gap: 4px; align-items: center;
    width: fit-content;
  }

  .hud-slot {
    padding: 4px 8px;
    background: #1c1538;
    border: 1px solid #3d3262;
    color: #8c7fb8;
    box-shadow: 1px 1px 0 #000;
    white-space: nowrap;
    cursor: pointer;
    font-size: 10px;
    transition: background 0.1s ease, border-color 0.1s ease, color 0.1s ease;
  }
  .hud-slot:hover {
    background: #2a2148;
    color: #ffffff;
    border-color: #8c7fb8;
  }
  .hud-slot.active {
    background: #392e62;
    border-color: #b9a3ff;
    color: #ffffff;
    box-shadow: 2px 2px 0 #000;
  }
  .hud-slot i {
    display: inline-block; width: 6px; height: 6px;
    margin-right: 5px; vertical-align: middle;
  }

  /* Collapsed (minimal resting state): hide inactive slots, hints, and collapse background tray */
  #hud.collapsed .hud-panel {
    padding: 0;
    border: none;
    background: transparent;
    box-shadow: none;
  }
  #hud.collapsed .hud-slot:not(.active) {
    display: none;
  }
  #hud.collapsed .hud-slots {
    gap: 0;
  }
  #hud.collapsed .hud-hints {
    display: none;
  }

  .hud-hints {
    font-size: 8px;
    color: #9f91cf;
    line-height: 1.4;
    white-space: nowrap;
    padding: 4px 6px;
  }
  .hud-hints b { color: #fff; }

  #unlockedPrompt {
    position: fixed;
    top: 22%; left: 0; right: 0;
    text-align: center;
    font-size: 11px;
    letter-spacing: 3px;
    color: #ffd13b;
    text-transform: uppercase;
    pointer-events: none;
    z-index: 24;
    text-shadow: 1px 1px 0 #000;
    display: none;
  }
  #unlockedPrompt.visible { display: block; }
</style>
</head>
<body>
<div id="stage"><canvas id="c"></canvas></div>
<div id="title">
  RAGDOLL BUDDY <b>v2.4</b> <span>·</span> MATERIAL LAB<br>
  <span>drag him · drag the void to orbit · pick a material below</span>
</div>
<div id="ui">
  <div class="row" id="matRow"></div>
  <div class="row" id="toolRow"></div>
</div>

<div id="cine">
  <div class="bar top"></div>
  <div class="bar bot"></div>
  <div id="cineTitle"><div class="n"></div><div class="s"></div></div>
  <button id="cineSkip">▶▶ SKIP</button>
  <div id="cineBar"><div id="cineBarFill"></div></div>
</div>

<div id="saverFade"></div>
<div id="saverTag">
  <div class="n"></div>
  <div class="s"></div>
  <div class="w">move · click · any key to wake</div>
</div>

<!-- PS1 Retro Elements -->
<div id="crosshair">
  <div class="reticle-bracket reticle-tl"></div>
  <div class="reticle-bracket reticle-tr"></div>
  <div class="reticle-bracket reticle-bl"></div>
  <div class="reticle-bracket reticle-br"></div>
  <div class="reticle-pip"></div>
</div>

<div id="unlockedPrompt">[ CLICK SCREEN TO AIM ]</div>

<div id="hud" class="hidden">
  <div class="hud-panel">
    <div class="hud-slots" id="hudSlots"></div>
  </div>
  <div class="hud-panel hud-hints" id="hudHints"></div>
</div>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>

<script type="module" src="./src/main.js"></script>
</body>
</html>
